<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f3a68">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<title>طلبيات الوكالة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<style>
/* Layout: work-desk tool — sticky header with search, stage strip, tabbed views, order detail panel */
:root{
  --bg:#f3f4f6; --surface:#ffffff; --surface-2:#eef0f4; --line:#d9dde5;
  --fg:#18202e; --muted:#5d6676; --accent:#1f3a68; --accent-fg:#ffffff; --accent-soft:#e3e9f5;
  --warn:#9a5b00; --warn-bg:#fff2d6; --ok:#17663f; --ok-bg:#dcf3e5; --bad:#a3262a; --bad-bg:#fbe2e2;
  --s-req:#4b5b77; --s-req-bg:#e7ebf2; --s-pri:#8a5a00; --s-pri-bg:#fdf0d2; --s-con:#2d3fa0; --s-con-bg:#e2e6fb;
  --s-par:#a24b00; --s-par-bg:#fde5d2; --s-arr:#0d6870; --s-arr-bg:#d7f0f2; --s-ent:#17663f; --s-ent-bg:#dcf3e5; --s-can:#8a2b2f; --s-can-bg:#f6e1e2;
  --f-body:"IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif; --f-mono:"IBM Plex Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151c; --surface:#192029; --surface-2:#212a35; --line:#2f3946;
  --fg:#e7ebf1; --muted:#9aa4b3; --accent:#8fb0ea; --accent-fg:#0f1724; --accent-soft:#22314a;
  --warn:#f0bd62; --warn-bg:#3a2c12; --ok:#7ad3a0; --ok-bg:#16301f; --bad:#f19a9c; --bad-bg:#3a1a1c;
  --s-req:#b6c1d6; --s-req-bg:#28313f; --s-pri:#f0c46a; --s-pri-bg:#3a2e14; --s-con:#a9b6ff; --s-con-bg:#252c55;
  --s-par:#f6ad74; --s-par-bg:#3d2615; --s-arr:#7fd6dd; --s-arr-bg:#123336; --s-ent:#7ad3a0; --s-ent-bg:#16301f; --s-can:#f19a9c; --s-can-bg:#3a1a1c;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151c; --surface:#192029; --surface-2:#212a35; --line:#2f3946;
  --fg:#e7ebf1; --muted:#9aa4b3; --accent:#8fb0ea; --accent-fg:#0f1724; --accent-soft:#22314a;
  --warn:#f0bd62; --warn-bg:#3a2c12; --ok:#7ad3a0; --ok-bg:#16301f; --bad:#f19a9c; --bad-bg:#3a1a1c;
  --s-req:#b6c1d6; --s-req-bg:#28313f; --s-pri:#f0c46a; --s-pri-bg:#3a2e14; --s-con:#a9b6ff; --s-con-bg:#252c55;
  --s-par:#f6ad74; --s-par-bg:#3d2615; --s-arr:#7fd6dd; --s-arr-bg:#123336; --s-ent:#7ad3a0; --s-ent-bg:#16301f; --s-can:#f19a9c; --s-can-bg:#3a1a1c;
  color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh}
img{max-width:100%}
[hidden]{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
.login form{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px 24px;width:min(380px,100%);display:flex;flex-direction:column;gap:14px}
.login h1{font-size:22px}
.login .err{color:var(--bad);font-size:13px;min-height:1em}
.userchip{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.userchip b{color:var(--fg)}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.hrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:12px}
h1{font-size:19px;margin:0;font-weight:700;text-wrap:balance}
.sub{color:var(--muted);font-size:12.5px}
.grow{flex:1 1 260px;min-width:0}
input,select,textarea,button{font:inherit;color:inherit}
input[type=text],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;width:100%}
textarea{min-height:120px;font-family:var(--f-mono);font-size:13px;direction:ltr;text-align:left}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.search{position:relative}
.search input{padding-inline-start:34px;font-family:var(--f-mono)}
.search input::placeholder{font-family:var(--f-body)}
.search svg{position:absolute;inset-inline-start:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;fill:none;stroke:var(--muted);stroke-width:2}
.role{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.role select{width:auto}
button{cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--surface);padding:7px 14px;font-weight:500}
button:hover{background:var(--surface-2)}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button.primary:hover{filter:brightness(1.08)}
button.ghost{border-color:transparent;background:transparent;color:var(--muted)}
button.danger{color:var(--bad);border-color:var(--bad-bg)}
button:disabled{opacity:.5;cursor:not-allowed}
.stages{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;padding-block:14px}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;text-align:start;display:flex;flex-direction:column;gap:2px}
.stage b{font-size:20px;font-variant-numeric:tabular-nums;line-height:1.2}
.stage span{font-size:12px;color:var(--muted)}
.stage.on{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
.stage .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-inline-end:6px}
@media (max-width:820px){.stages{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:460px){.stages{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:none;background:none;border-radius:0;padding:10px 14px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected=true]{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
main{padding-block:16px 48px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:9px 12px;text-align:start;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--surface-2);letter-spacing:.02em}
tbody tr:last-child td{border-bottom:none}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
td.wrapcell{white-space:normal;min-width:160px}
.pn{font-family:var(--f-mono);font-weight:600;direction:ltr;unicode-bidi:isolate;letter-spacing:.01em}
.num{font-family:var(--f-mono);direction:ltr;unicode-bidi:isolate}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.flag{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:4px}
.flag.warn{background:var(--warn-bg);color:var(--warn)}
.flag.ok{background:var(--ok-bg);color:var(--ok)}
.flag.bad{background:var(--bad-bg);color:var(--bad)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px}
.toolbar select{width:auto}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty h3{color:var(--fg);margin:0 0 6px;font-size:16px}
.grid2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);min-width:0}
.sec{padding:16px;display:flex;flex-direction:column;gap:14px}
.sec h2{margin:0;font-size:16px}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spacer{flex:1}
/* detail drawer */
.scrim{position:fixed;inset:0;background:rgba(10,14,22,.45);z-index:20}
.drawer{position:fixed;top:0;bottom:0;inset-inline-start:0;width:min(760px,100%);background:var(--bg);z-index:21;overflow-y:auto;border-inline-end:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer .dh{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:14px max(16px,env(safe-area-inset-left,0px)) 14px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;z-index:2}
.drawer .db{padding:16px;display:flex;flex-direction:column;gap:14px}
.steps{display:flex;gap:0;overflow-x:auto;padding:4px 0}
.step{flex:1 0 92px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;color:var(--muted);position:relative;text-align:center}
.step i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:700;z-index:1}
.step::before{content:"";position:absolute;top:11px;inset-inline-start:-50%;width:100%;height:2px;background:var(--line)}
.step:first-child::before{display:none}
.step.done i{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.step.done::before,.step.cur::before{background:var(--accent)}
.step.cur i{border-color:var(--accent);color:var(--accent)}
.step.cur{color:var(--fg);font-weight:600}
.log{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.log li{display:flex;gap:10px;align-items:baseline;font-size:13px;flex-wrap:wrap}
.log time{color:var(--muted);font-size:12px;font-family:var(--f-mono);direction:ltr;unicode-bidi:isolate}
td input[type=number],td input[type=text]{width:90px;padding:4px 6px}
td input.wide{width:180px}
.total{font-weight:700}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:40;font-size:13.5px;max-width:calc(100% - 32px)}
.banner{background:var(--warn-bg);color:var(--warn);padding:10px 14px;border-radius:8px;font-size:13px}
.hitbox{padding:12px;display:flex;flex-direction:column;gap:6px}
.dropzone{border:1.5px dashed var(--line);border-radius:8px;padding:14px;text-align:center;color:var(--muted);font-size:13px}
.dropzone.over{border-color:var(--accent);background:var(--accent-soft)}
.who{display:inline-flex;align-items:center;gap:5px}
.who img{width:18px;height:18px;border-radius:50%}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(-24px);opacity:.6}to{transform:none;opacity:1}}}

.flag.info{background:var(--accent-soft);color:var(--accent)}
tr.off td{opacity:.55}
tr.off td .pn{text-decoration:line-through}
.batch{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.batch .row{gap:6px 12px}
.kind{font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:4px;background:var(--surface-2);color:var(--muted)}
.mini{padding:3px 9px;font-size:12.5px}
a{color:var(--accent)}
</style>

</head>
<body>
<div id="login" class="login" hidden><form id="loginForm" autocomplete="on">
  <div><h1>طلبيات الوكالة</h1><div class="sub">سجّل دخولك عشان تكمل</div></div>
  <label class="f" for="lUser">اسم المستخدم<input id="lUser" type="text" autocomplete="username" autocapitalize="off" dir="ltr" required></label>
  <label class="f" for="lPass">كلمة المرور<input id="lPass" type="password" autocomplete="current-password" dir="ltr" required style="background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;width:100%"></label>
  <div class="err" id="lErr"></div>
  <button class="primary" type="submit" id="lBtn">دخول</button>
</form></div>
<div id="app" hidden>
<header>
  <div class="wrap hrow">
    <div>
      <h1>طلبيات الوكالة</h1>
      <div class="sub">بترومين · بن ضباب والطلبيات الخارجية — من الطلب حتى الإدخال بالنظام</div>
    </div>
    <div class="grow search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="text" placeholder="ابحث برقم القطعة أو رقم الويب أو العميل…" autocomplete="off" aria-label="بحث">
    </div>
    <div class="userchip"><span>مسجّل كـ <b id="whoami"></b></span><button class="ghost mini" id="logout">خروج</button></div>
  </div>
</header>

<div class="wrap">
  <div class="stages" id="stages"></div>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="orders" aria-selected="true">الطلبيات</button>
    <button class="tab" role="tab" data-tab="queue" aria-selected="false">قائمة الانتظار (القطع)</button>
    <button class="tab" role="tab" data-tab="check" aria-selected="false">فحص قبل الطلب</button>
    <button class="tab" role="tab" data-tab="new" aria-selected="false" id="tabNew">+ طلبية جديدة</button>
  </nav>
  <main id="main"></main>
</div>
</div>
<div id="drawerRoot"></div>
<div id="toastRoot"></div>

<script>
const STATUSES = [
  {k:"requested", t:"طلب تسعير",  c:"req"},
  {k:"priced",    t:"تسعّرت",     c:"pri"},
  {k:"confirmed", t:"تأكدت",      c:"con"},
  {k:"partial",   t:"وصلت جزئياً", c:"par"},
  {k:"arrived",   t:"وصلت",       c:"arr"},
  {k:"entered",   t:"دخلت النظام", c:"ent"},
  {k:"cancelled", t:"ملغاة",      c:"can"},
];
const ST = Object.fromEntries(STATUSES.map(s=>[s.k,s]));
const FLOW = ["requested","priced","confirmed","arrived","entered"];
const OPEN = new Set(["requested","priced","confirmed","partial","arrived"]);
const ROLE_T = {owner:"المدير", store:"المستودع", entry:"مدخل البيانات"};
const KIND_T = {local:"وكالة", external:"طلبية خارجية"};

let db=null, assets=true, myId=null, isOwner=false, canWrite=true; let unsub=null;
let orders=[]; let loaded=false; let tab="orders"; let filter="open"; let openId=null; let q="";
const blankDraft=()=>({web:"",kind:"local",supplier:"بترومين — بن ضباب",customer:"",expected:"",note:"",items:[],quotes:[]});
let draft=blankDraft();
let role="store";
let checkText=""; let pendingQuote=null;

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// Agency files write N + number without hyphen (N10101VW227); the shop system uses 10101-VW227 (+A for original)
const normPN=s=>{let p=String(s||"").toUpperCase().replace(/[\s_.]+/g,"").replace(/[–—]/g,"-").trim();
  if(!p.includes("-")){ if(/^N[A-Z0-9]{10,12}$/.test(p)) p=p.slice(1); if(p.length>=10&&/^[A-Z0-9]+$/.test(p)) p=p.slice(0,5)+"-"+p.slice(5) }
  return p};
const keyPN=s=>normPN(s).replace(/-/g,"");
const baseA=k=>k.length===11&&k.endsWith("A")?k.slice(0,-1):k;
const normWeb=s=>String(s||"").toUpperCase().replace(/\s+/g,"");
const fmtD=iso=>{if(!iso)return"";const d=new Date(iso);return d.toLocaleDateString("en-GB")+" "+d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})};
const fmtDay=iso=>iso?new Date(iso).toLocaleDateString("en-GB"):"";
const today=()=>new Date().toISOString().slice(0,10);
const money=n=>(Number(n)||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const N=v=>Number(v)||0;
const pill=k=>{const s=ST[k]||ST.requested;return `<span class="pill" style="background:var(--s-${s.c}-bg);color:var(--s-${s.c})">${s.t}</span>`};
const active=it=>!it.st||it.st==="active";
const recvOf=(o,i)=>(o.shipments||[]).reduce((a,s)=>a+(s.lines||[]).filter(l=>l.i===i).reduce((b,l)=>b+N(l.qty),0),0);
const entOf=(o,i)=>(o.shipments||[]).filter(s=>s.enteredAt).reduce((a,s)=>a+(s.lines||[]).filter(l=>l.i===i).reduce((b,l)=>b+N(l.qty),0),0);
const total=o=>(o.items||[]).reduce((a,it)=>a+(active(it)?N(it.qty)*N(it.price):0),0);
const overdue=o=>o.expected&&["requested","priced","confirmed","partial"].includes(o.status)&&o.expected<today();
const pendingBatches=o=>(o.shipments||[]).filter(s=>!s.enteredAt);
function toast(m){const r=$("#toastRoot");r.innerHTML=`<div class="toast" role="status">${esc(m)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>r.innerHTML="",2800)}

/* ---------- queue ---------- */
function queueRows(){
  const rows=[];
  for(const o of orders){ if(!OPEN.has(o.status)) continue;
    (o.items||[]).forEach((it,i)=>{ if(!active(it)) return;
      const rc=recvOf(o,i), out=Math.max(N(it.qty)-rc,0), pend=rc-entOf(o,i);
      if(out>0||pend>0) rows.push({o,it,i,out,pend});
    });}
  return rows;
}
function lookup(pn){
  const n=keyPN(pn), b=baseA(n); const exact=[], near=[], na=[];
  for(const r of queueRows()){ const p=keyPN(r.it.pn); if(p===n) exact.push(r); else if(baseA(p)===b) near.push(r); }
  for(const o of orders){ if(o.status==="cancelled") continue; (o.items||[]).forEach(it=>{ if(it.st==="na"&&baseA(keyPN(it.pn))===b) na.push({o,it}) }) }
  return {exact,near,na};
}

/* ---------- render ---------- */
function render(){
  renderStages();
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected", b.dataset.tab===tab));
  $("#tabNew").hidden=role!=="owner";
  const m=$("#main");
  if(!loaded){m.innerHTML=`<div class="panel empty"><h3>جارٍ تحميل الطلبيات…</h3></div>`;return}
  if(q.trim()) renderSearch(m);
  else if(tab==="orders") renderOrders(m);
  else if(tab==="queue") renderQueue(m);
  else if(tab==="check") renderCheck(m);
  else renderNew(m);
  renderDrawer();
}
function renderStages(){
  const cnt={}; orders.forEach(o=>cnt[o.status]=(cnt[o.status]||0)+1);
  const cells=[{k:"open",t:"المفتوحة",n:orders.filter(o=>OPEN.has(o.status)).length},
    {k:"late",t:"متأخرة",n:orders.filter(overdue).length,c:"can"},
    ...["requested","priced","confirmed","partial","arrived"].map(k=>({k,t:ST[k].t,n:cnt[k]||0,c:ST[k].c}))];
  $("#stages").innerHTML=cells.map(c=>`<button class="stage ${tab==="orders"&&!q&&filter===c.k?"on":""}" data-filter="${c.k}">
    <span>${c.c?`<i class="dot" style="background:var(--s-${c.c})"></i>`:""}${c.t}</span><b>${c.n}</b></button>`).join("");
}
function orderRow(o){
  const its=(o.items||[]).filter(active); const qty=its.reduce((a,i)=>a+N(i.qty),0);
  const rc=(o.items||[]).reduce((a,it,i)=>a+(active(it)?Math.min(recvOf(o,i),N(it.qty)):0),0);
  const nx=nextAction(o); const pb=pendingBatches(o).length;
  return `<tr class="click" data-open="${esc(o.id)}"><td class="pn">${esc(o.web)}</td>

function matchQuote(o,list){
  const items=o.items||[]; const used=new Set(); const res={matched:[],qtyChg:[],missing:[],extra:[],total:0,map:[]};
  const idx=k=>{let i=items.findIndex((it,x)=>!used.has(x)&&active(it)&&keyPN(it.pn)===k); if(i<0) i=items.findIndex((it,x)=>!used.has(x)&&active(it)&&baseA(keyPN(it.pn))===baseA(k)); return i};
  for(const q of list){ res.total+=N(q.qty)*N(q.price); const i=idx(keyPN(q.pn));
    if(i<0){res.extra.push(q);continue} used.add(i); res.map.push({i,q}); res.matched.push(q);
    if(N(items[i].qty)!==N(q.qty)) res.qtyChg.push({pn:items[i].pn,from:items[i].qty,to:q.qty}) }
  items.forEach((it,x)=>{ if(active(it)&&!used.has(x)) res.missing.push({pn:it.pn,i:x}) });
  return res;
}

function arrivalStatus(o,items,shipments){
  const t={...o,items,shipments}; const act=items.map((it,i)=>[it,i]).filter(([it])=>active(it));
  if(!act.length) return o.status;
  const all=act.every(([it,i])=>recvOf(t,i)>=N(it.qty)), any=act.some(([,i])=>recvOf(t,i)>0);
  if(all) return shipments.length&&shipments.every(s=>s.enteredAt)?"entered":"arrived";
  return any?"partial":o.status;
}

async function uploadQuote(file){

  }

/* ---------- import ---------- */
function parseRows(rows){
  let start=0, col={pn:0,name:-1,qty:-1,price:-1,cust:-1};
  const hi=rows.findIndex((r,i)=>i<10&&(r||[]).some(c=>/رقم القطعة|^الرقم$|^رقم$|part|الكمية|^qty|^qyt/i.test(String(c||"").trim())));
  if(hi>=0){
    const h=rows[hi].map(c=>String(c||"").trim()); const find=re=>h.findIndex(c=>re.test(c));
    start=hi+1;
    const pn=find(/رقم القطعة|^الرقم$|^رقم$|^parts?\b|part ?#|part ?no|item ?no|رقم الصنف/i); if(pn>=0) col.pn=pn;
    col.name=find(/الاسم|اسم|name|desc|الوصف/i);
    col.qty=find(/الكمية المطلوبة|الكمية المقترحة|^الكمية$|^الكميه$|^كمية$|^qty|^qyt|quantity/i); if(col.qty<0) col.qty=find(/كمي/i);
    col.price=find(/u\/?\s*price|unit ?price|^price|سعر/i); col.cust=find(/عميل|customer/i);
  }
  const out=[];
  for(const r of rows.slice(start)){
    const cells=(r||[]).map(c=>c==null?"":String(c).trim()); if(!cells.length) continue;
    const pn=normPN(cells[col.pn]); if(!pn||!/[0-9]/.test(pn)) continue;
    let qty,name="",price=null,cust="";
    if(hi>=0){ qty=Number(cells[col.qty]); name=col.name>=0?cells[col.name]:""; price=col.price>=0&&cells[col.price]!==""?Math.round(Number(String(cells[col.price]).replace(/,/g,""))*10000)/10000:null; cust=col.cust>=0?cells[col.cust]:"" }
    else { const rest=cells.slice(1).filter(c=>c!==""); const nums=rest.filter(c=>!isNaN(Number(c))); name=rest.filter(c=>isNaN(Number(c))).join(" "); qty=Number(nums[0]); price=nums[1]!=null?Number(nums[1]):null }
    out.push({pn,name,qty:isFinite(qty)&&qty>0?qty:1,price:isFinite(price)?price:null,cust});
  }
  out.title = hi>0 ? String((rows[0]||[]).find(c=>c)||"").trim() : "";
  return out;
}
function mergeDraft(list){
  let added=0; for(const it of list){ const ex=draft.items.find(i=>keyPN(i.pn)===keyPN(it.pn)); if(ex){ex.qty=N(ex.qty)+it.qty} else {draft.items.push(it);added++} }
  toast(`أُضيف ${added} صنف${list.length-added?` ودُمج ${list.length-added} مكرر`:""}`); render();
}
function readRows(f,cb){
  if(typeof XLSX==="undefined"){toast("قارئ Excel ما تحمّل");return}
  const fr=new FileReader(); fr.onload=()=>{ try{ const wb=XLSX.read(fr.result,{type:"array"});
    const list=parseRows(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:""}));
    if(!list.length){toast("ما لقيت أرقام قطع في الملف");return} cb(list) }catch(e){toast("تعذّر قراءة الملف")} };
  fr.readAsArrayBuffer(f);
}
function readFile(f){
  if(typeof XLSX==="undefined"){toast("قارئ Excel ما تحمّل — الصق البيانات بدلاً من ذلك");return}
  const fr=new FileReader(); fr.onload=()=>{ try{ const wb=XLSX.read(fr.result,{type:"array"});
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:""});
    const list=parseRows(rows); if(!list.length){toast("ما لقيت أرقام قطع في الملف");return}
    if(!draft.note) draft.note=list.title||f.name.replace(/\.[^.]+$/,"").replace(/_/g," ");
    mergeDraft(list) }catch(e){toast("تعذّر قراءة الملف")} };
  fr.readAsArrayBuffer(f);
}

async function exportXlsx(kind){

  if(kind==="queue") rows=[["رقم القطعة","الاسم","باقي ما وصل","واصل بانتظار الإدخال","رقم الويب","العميل","الحالة","تاريخ الطلب"],...queueRows().map(r=>[r.it.pn,r.it.name||"",r.out,r.pend,r.o.web,r.it.cust||r.o.customer||"",ST[r.o.status].t,fmtDay(r.o.createdAt)])];

  const wb=XLSX.utils.book_new(); const ws=XLSX.utils.aoa_to_sheet(rows); ws["!cols"]=rows[0].map(()=>({wch:16})); wb.Workbook={Views:[{RTL:true}]};

  saveBlob(new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}),(kind==="queue"?"انتظار-الوكالة-":"طلبيات-الوكالة-")+today()+".xlsx");
}

    case "saveBatch": { const lines=[...document.querySelectorAll("[data-b]")].map(inp=>({i:+inp.dataset.b,qty:Math.min(N(inp.value),N(inp.max))})).filter(l=>l.qty>0);
      if(!lines.length){toast("اكتب كمية هذي الدفعة لقطعة وحدة على الأقل");return}
      const sh=[...(o.shipments||[]),{id:"s"+Date.now(),at:new Date().toISOString(),by:myId,lines}];
      const st=arrivalStatus(o,o.items,sh);
      if(await writeOrder(o,{shipments:sh,status:st},{s:st,note:`دفعة ${sh.length}: ${lines.reduce((a,l)=>a+l.qty,0)} حبة`})) toast(st==="arrived"?"اكتمل وصول الطلبية":"انسجلت الدفعة"); return }
    case "cancelO": if(armConfirm(t,"اضغط مرة ثانية للتأكيد")) return setStatus(o,"cancelled"); return;
  }
  if(t.dataset.st && o){ const extra=role==="owner"&&document.querySelector("[data-e]")?{items:readEdits(o),...readMeta()}:{};
    if(t.dataset.st==="priced"&&extra.items&&extra.items.some(i=>active(i)&&i.price==null)&&!armConfirm(t,"فيه قطع بدون سعر — اضغط للتأكيد")) return;
    return setStatus(o,t.dataset.st,extra) }
});
document.addEventListener("input",ev=>{
  const t=ev.target;
  if(t.id==="q"){q=t.value;render();return}
  const map={nWeb:"web",nSup:"supplier",nCust:"customer",nNote:"note",nExp:"expected",nKind:"kind"};
  if(map[t.id]){draft[map[t.id]]=t.value; if(t.id==="nWeb") syncSave(); return}
  if(t.dataset.d!=null){const i=draft.items[+t.dataset.d]; const f=t.dataset.f; i[f]=f==="qty"||f==="price"?(t.value===""?null:Number(t.value)):t.value;}
});
document.addEventListener("change",async ev=>{
  const t=ev.target;
  if(t.id==="flt"){filter=t.value;render();return}
  if(t.id==="nKind"){draft.kind=t.value; if(t.value==="external"&&/بن ضباب/.test(draft.supplier)) {draft.supplier="";render()} return}
  if(t.id==="file"&&t.files[0]){readFile(t.files[0]);t.value="";return}
  if(t.id==="quoteXls"&&t.files[0]){ const f=t.files[0]; t.value=""; const o=orders.find(x=>x.id===openId); if(!o) return;
    readRows(f,list=>{ pendingQuote={oid:o.id,name:f.name,file:f,list,res:matchQuote(o,list)}; renderDrawer() }); return }
  if(t.id==="nWeb"){render();return}
  if(t.id==="qFileNew"&&t.files[0]){const file=t.files[0]; t.value=""; if(/\.(xlsx?|csv)$/i.test(file.name)&&!draft.items.length) readFile(file); const f=await uploadQuote(file); if(f){draft.quotes.push(f);render();toast("انرفق الملف")} return}
  if(t.id==="qFile"&&t.files[0]){const o=orders.find(x=>x.id===openId); const f=await uploadQuote(t.files[0]); t.value=""; if(o&&f&&await writeOrder(o,{quotes:[...(o.quotes||[]),f]},{note:"إرفاق "+f.name})) toast("انرفق الملف"); return}
  if(t.dataset.d!=null&&t.dataset.f==="pn"){renderDraftTbl();syncSave()}
});
document.addEventListener("dragover",ev=>{const dz=ev.target.closest&&ev.target.closest("#dz");if(dz){ev.preventDefault();dz.classList.add("over")}});
document.addEventListener("dragleave",ev=>{const dz=ev.target.closest&&ev.target.closest("#dz");if(dz)dz.classList.remove("over")});
document.addEventListener("drop",ev=>{const dz=ev.target.closest&&ev.target.closest("#dz");if(dz){ev.preventDefault();dz.classList.remove("over");const f=ev.dataTransfer.files[0];if(f)readFile(f)}});
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"&&openId){openId=null;renderDrawer()}});

/* ---------- boot ---------- */
const USERS = (window.APP_CONFIG&&APP_CONFIG.users)||{};
const DOMAIN = (window.APP_CONFIG&&APP_CONFIG.domain)||"banaeem.app";
function userLabel(id){ const u=USERS[id]; return u?u.name:id }
function fileLink(f){ return f.url?`<a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.name)}</a>`:`<button class="ghost mini" data-file="${esc(f.id)}" style="color:var(--accent);text-decoration:underline;padding:0">${esc(f.name)}</button>` }
function saveBlob(blob,name){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500) }
document.addEventListener("click",async ev=>{ const b=ev.target.closest("[data-file]"); if(!b) return; ev.stopPropagation();
  try{ const d=await db.collection("files").doc(b.dataset.file).get(); if(!d.exists){toast("الملف غير موجود");return}
    const {name,data}=d.data(); const blob=await (await fetch(data)).blob(); saveBlob(blob,name) }catch(e){toast("تعذّر فتح الملف")} },true);
$("#logout").onclick=()=>firebase.auth().signOut();
$("#loginForm").addEventListener("submit",async ev=>{ ev.preventDefault();
  const u=$("#lUser").value.trim().toLowerCase(), p=$("#lPass").value; $("#lErr").textContent=""; $("#lBtn").disabled=true;
  const email=u.includes("@")?u:u+"@"+DOMAIN;
  try{ await firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL); await firebase.auth().signInWithEmailAndPassword(email,p) }
  catch(e){ $("#lErr").textContent=/network/.test(e.code||"")?"ما فيه اتصال بالإنترنت":"اسم المستخدم أو كلمة المرور غلط" }
  $("#lBtn").disabled=false });

if(!window.APP_CONFIG||!APP_CONFIG.firebase||!APP_CONFIG.firebase.apiKey){
  document.body.innerHTML=`<div class="login"><div class="panel sec" style="max-width:420px"><h2>الإعداد ناقص</h2><p class="hint">ملف config.js ما فيه بيانات Firebase.</p></div></div>`;
} else {
  firebase.initializeApp(APP_CONFIG.firebase);
  db=firebase.firestore();
  firebase.auth().onAuthStateChanged(u=>{
    if(unsub){unsub();unsub=null}
    if(!u){ $("#app").hidden=true; $("#login").hidden=false; orders=[]; loaded=false; openId=null; renderDrawer(); setTimeout(()=>$("#lUser").focus(),50); return }
    myId=(u.email||"").split("@")[0];
    const cfg=USERS[myId]||{role:"store",name:myId};
    role=cfg.role; isOwner=role==="owner"; if(!isOwner&&tab==="new") tab="orders";
    $("#whoami").textContent=cfg.name+" · "+ROLE_T[role];
    $("#login").hidden=true; $("#app").hidden=false; $("#lPass").value="";
    render();
    unsub=db.collection("orders").onSnapshot(snap=>{
      orders=snap.docs.map(d=>({id:d.id,...d.data()}));
      loaded=true;
      const a=document.activeElement; const editing=a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.id!=="q";
      if(editing){ renderStages(); if(tab==="new") renderDraftTbl(); return }
      render();
    }, e=>{ loaded=true; $("#main").innerHTML=`<div class="panel empty"><h3>انقطع الاتصال بالبيانات</h3><p class="hint">${esc(e.code||"")} — حدّث الصفحة.</p></div>` });
  });
}
</script>
</body>
